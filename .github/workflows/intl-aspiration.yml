# =====================================================================
# WORKFLOW SÉPARÉ — Aspiration internationale (téléchargement des TEXTES)
# À placer dans le dépôt "droit" sous : .github/workflows/intl-aspiration.yml
#
# 3 JOBS PARALLÈLES d'aspiration (EUR-Lex / CJUE / HUDOC), chacun avec son
# PROPRE budget de 5h30 (une source lente/bloquée ne pénalise plus les autres).
# + 1 JOB "construire-index" qui reconstruit les index de recherche APRÈS les
#   3 aspirations -> c'est lui qui fait apparaître l'international dans la
#   recherche de MonLegiTexte (tu ne peux pas lancer le builder à la main).
# =====================================================================

name: Aspiration internationale (textes)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 5 * * 1"          # chaque LUNDI à 05:00 UTC — 2h après le recensement

concurrency:
  group: intl-aspiration
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aspirer-eurlex:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Installer les dépendances
        run: pip install requests beautifulsoup4
      - name: Aspiration EUR-Lex
        run: python scripts/aspire_eurlex.py
      - name: Commit final de sécurité (EUR-Lex)
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/intl/textes-eurlex/*.json 2>/dev/null || true
          if git diff --staged --quiet; then echo "Rien à committer."; exit 0; fi
          git commit -m "Aspiration EUR-Lex (filet de sécurité) [skip ci]"
          n=0
          until git push; do
            n=$((n+1)); if [ "$n" -ge 5 ]; then echo "::error::Push EUR-Lex impossible après 5 tentatives."; exit 1; fi
            sleep $((n*5)); git fetch origin main; git rebase origin/main || { echo "::error::Rebase en conflit."; exit 1; }
          done
          echo "Push confirmé sur main."

  aspirer-cjue:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Installer les dépendances
        run: pip install requests beautifulsoup4
      - name: Aspiration CJUE
        run: python scripts/aspire_cjue.py
      - name: Commit final de sécurité (CJUE)
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/intl/textes-cjue/*.json 2>/dev/null || true
          if git diff --staged --quiet; then echo "Rien à committer."; exit 0; fi
          git commit -m "Aspiration CJUE (filet de sécurité) [skip ci]"
          n=0
          until git push; do
            n=$((n+1)); if [ "$n" -ge 5 ]; then echo "::error::Push CJUE impossible après 5 tentatives."; exit 1; fi
            sleep $((n*5)); git fetch origin main; git rebase origin/main || { echo "::error::Rebase en conflit."; exit 1; }
          done
          echo "Push confirmé sur main."

  aspirer-hudoc:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Installer les dépendances
        run: pip install requests beautifulsoup4
      - name: Aspiration HUDOC / CEDH
        run: python scripts/aspire_hudoc.py
      - name: Commit final de sécurité (HUDOC)
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/intl/textes-hudoc/*.json 2>/dev/null || true
          if git diff --staged --quiet; then echo "Rien à committer."; exit 0; fi
          git commit -m "Aspiration HUDOC (filet de sécurité) [skip ci]"
          n=0
          until git push; do
            n=$((n+1)); if [ "$n" -ge 5 ]; then echo "::error::Push HUDOC impossible après 5 tentatives."; exit 1; fi
            sleep $((n*5)); git fetch origin main; git rebase origin/main || { echo "::error::Rebase en conflit."; exit 1; }
          done
          echo "Push confirmé sur main."

  # Reconstruit les index de recherche À PARTIR des textes aspirés, APRÈS les
  # 3 jobs (needs). "if: always()" -> tourne même si un des 3 a échoué/expiré
  # (ex. HUDOC bloqué), pour qu'EUR-Lex + CJUE soient indexés quand même.
  # C'est CE job qui fait apparaître l'international dans la recherche.
  construire-index:
    runs-on: ubuntu-latest
    needs: [aspirer-eurlex, aspirer-cjue, aspirer-hudoc]
    if: always()
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Construire les index de recherche internationaux
        run: python scripts/build_search_index_intl.py
      - name: Committer les index internationaux
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/search-index-eurlex.json output/search-index-cjue.json output/search-index-cedh.json 2>/dev/null || true
          if git diff --staged --quiet; then echo "Index inchangés."; exit 0; fi
          git commit -m "Index de recherche international (auto) [skip ci]"
          n=0
          until git push; do
            n=$((n+1)); if [ "$n" -ge 5 ]; then echo "::error::Push index impossible après 5 tentatives."; exit 1; fi
            sleep $((n*5)); git fetch origin main; git rebase origin/main || { echo "::error::Rebase en conflit."; exit 1; }
          done
          echo "Index poussés sur main."
