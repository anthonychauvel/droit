# =====================================================================
# WORKFLOW SÉPARÉ — Aspiration internationale (téléchargement des TEXTES)
# À placer dans le dépôt "droit" sous : .github/workflows/intl-aspiration.yml
#
# Distinct du recensement ET du français : fichier/nom/déclencheurs propres,
# groupe de concurrence dédié. Ne committe QUE output/intl/textes-*.
#
# L'aspiration est LOURDE -> lancement MANUEL, par LOTS. Chaque exécution
# télécharge un lot (le script saute ce qui est déjà fait) : relancer reprend
# la suite. Pour EUR-Lex (~702 actes, 250/lot) : ~3 lancements.
# =====================================================================

name: Aspiration internationale (textes)

on:
  workflow_dispatch: {}          # bouton "Run workflow" (lancement manuel)
  # Décommente pour une reprise automatique quotidienne jusqu'à complétion :
  # schedule:
  #   - cron: "0 3 * * *"

concurrency:
  group: intl-aspiration
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aspirer:
    runs-on: ubuntu-latest
    timeout-minutes: 330         # marge sous la limite des 6 h
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4

      - name: Aspiration EUR-Lex (un lot)
        run: python scripts/aspire_eurlex.py
        continue-on-error: true

      - name: Committer les textes (output/intl/textes-* uniquement)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/intl/textes-*/**.json 2>/dev/null || true
          git add output/intl/textes-*/*.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Aucun nouveau texte à committer."
          else
            git commit -m "Aspiration internationale (lot) [skip ci]"
            git pull --rebase --autostash || true
            git push || echo "Push à réessayer (conflit éventuel)."
          fi
