# =====================================================================
# WORKFLOW SÉPARÉ — Aspiration internationale (téléchargement des TEXTES)
# À placer dans le dépôt "droit" sous : .github/workflows/intl-aspiration.yml
#
# Distinct du recensement ET du français : fichier/nom/déclencheurs propres,
# groupe de concurrence dédié. Ne committe QUE output/intl/textes-*.
#
# L'aspiration est LOURDE -> lancement MANUEL, par LOTS. Chaque exécution
# télécharge un lot (le script saute ce qui est déjà fait) : relancer reprend
# la suite. Pour EUR-Lex (~702 actes, 250/lot) : ~3 lancements.
# =====================================================================

name: Aspiration internationale (textes)

on:
  workflow_dispatch: {}          # bouton "Run workflow" (lancement manuel)
  # Décommente pour une reprise automatique quotidienne jusqu'à complétion :
  # schedule:
  #   - cron: "0 3 * * *"

concurrency:
  group: intl-aspiration
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aspirer:
    runs-on: ubuntu-latest
    timeout-minutes: 330         # marge sous la limite des 6 h
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4

      - name: Aspiration EUR-Lex (un lot)
        run: python scripts/aspire_eurlex.py
        continue-on-error: true

      - name: Aspiration CJUE (un lot)
        run: python scripts/aspire_cjue.py
        continue-on-error: true

      - name: Aspiration HUDOC / CEDH (un lot)
        run: python scripts/aspire_hudoc.py
        continue-on-error: true

      - name: Committer les textes (output/intl/textes-* uniquement)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/intl/textes-*/**.json 2>/dev/null || true
          git add output/intl/textes-*/*.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Aucun nouveau texte à committer."
            exit 0
          fi
          git commit -m "Aspiration internationale (lot) [skip ci]"
          # Push ROBUSTE : jusqu'à 5 tentatives, avec re-synchronisation
          # (fetch + rebase) entre chaque, pour absorber un commit concurrent.
          # Si tout échoue, le JOB ÉCHOUE (visible en rouge) au lieu de se
          # terminer "avec succès" en ayant en fait perdu le travail du run.
          n=0
          until git push; do
            n=$((n+1))
            if [ "$n" -ge 5 ]; then
              echo "::error::Push impossible après 5 tentatives — le lot téléchargé N'A PAS été sauvegardé. Relance le workflow."
              exit 1
            fi
            echo "Push refusé (tentative $n/5) — re-synchronisation puis nouvel essai..."
            sleep $((n*5))
            git fetch origin main
            git rebase origin/main || { echo "::error::Rebase en conflit — intervention manuelle nécessaire."; exit 1; }
          done
          echo "Push confirmé sur main."
