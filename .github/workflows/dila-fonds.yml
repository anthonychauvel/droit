name: Aspirateur DILA (circulaires, Conseil constitutionnel, Conseil d'État)

# Le mardi à 5h07 UTC : récupère les mises à jour open data de la DILA pour
# trois fonds (circulaires et instructions, décisions du Conseil
# constitutionnel, décisions du Conseil d'État), garde ce qui touche
# l'écosystème dans output/{circulaires,constit,jade}/ et committe.
# Le tableau de bord les lit au passage du mercredi 9h07.
on:
  schedule:
    - cron: "7 5 * * 2"
  workflow_dispatch:
    inputs:
      diagnostic:
        description: "Afficher les archives trouvées"
        required: true
        default: "non"
        type: choice
        options: [non, oui]

permissions:
  contents: write

# Même verrou que les autres aspirateurs : jamais deux push en même temps.
concurrency:
  group: aspirateur-legifrance
  cancel-in-progress: false

jobs:
  dila:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Repli sur l'API Légifrance si l'open data DILA ne répond pas.
    env:
      PISTE_CLIENT_ID: ${{ secrets.PISTE_CLIENT_ID }}
      PISTE_CLIENT_SECRET: ${{ secrets.PISTE_CLIENT_SECRET }}
      PISTE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aspirer les mises à jour
        run: |
          D=""
          [ "${{ github.event.inputs.diagnostic }}" = "oui" ] && D="--diagnostic"
          python3 scripts/pull_dila_fonds.py --fonds CIRCULAIRES,CONSTIT,JADE --out output $D \
            || { echo "pull_dila_fonds a échoué";
                 J=$(date -u +%Y-%m-%dT%H:%MZ);
                 echo "$J dila" >> audits/etapes-en-echec.log; }

      - name: Committer
        run: |
          git config user.name "Aspirateur Légifrance (bot)"
          git config user.email "action@github.com"
          for c in output/circulaires output/constit output/jade \
                   audits/etapes-en-echec.log; do
            [ -e "$c" ] && git add "$c" || true
          done
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
          else
            J=$(date -u +%Y-%m-%dT%H:%MZ)
            git commit -m "DILA : circulaires, Conseil constit., Conseil d'État ($J)"
            git pull --rebase --autostash origin main || true
            git push || (sleep 5 && git pull --rebase --autostash origin main && git push)
          fi
