name: CGFP + Code civil/pénal (élargi) — un seul run

# Combine les deux chantiers dans le même job : ni le CGFP (~4 245 articles)
# ni la recherche élargie civil/pénal (quelques dizaines à centaines
# d'articles) ne sont volumineux -- pas besoin de deux workflows séparés,
# un seul checkout/setup/commit suffit.
#
# CGFP : réutilise TES scripts existants (list_all_code_articles.py,
# pull_code_travail.py -- déjà génériques, prennent un --code-id) avec
# LEGITEXT000044416551. Même mécanisme que Code du travail/Code sécu, déjà
# éprouvé en prod -- peu de risque.
#
# Code civil/pénal : script dédié (rechercher_articles_code_civil_penal.py),
# recherche élargie par mots-clés dans le fond CODE puis filtre par nom de
# code. Deux hypothèses non testées (nom du champ "code source" dans /search,
# structure de /consult/code) -- imprime la réponse brute au 1er essai pour
# diagnostic si rien ne matche, comme pour l'OIT/JORF.
on:
  workflow_dispatch:
    inputs:
      seulement_manquants:
        description: "CGFP : ne retraiter que les articles absents/en erreur"
        required: true
        default: "oui"
        type: choice
        options: [oui, non]
  schedule:
    - cron: "17 6 * * 2"   # mardi, décalé des autres crons du dépôt

permissions:
  contents: write

concurrency:
  group: cgfp-civil-penal
  cancel-in-progress: false

jobs:
  aspirer:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PISTE_CLIENT_ID: ${{ secrets.PISTE_CLIENT_ID }}
      PISTE_CLIENT_SECRET: ${{ secrets.PISTE_CLIENT_SECRET }}
      PISTE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Config Git : stratégie anti-conflit sur les fichiers générés"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          printf '%s\n' \
            'output/cgfp/*.json merge=ours' \
            'all_articles_cgfp.txt merge=ours' \
            'output/code-civil-travail/*.json merge=ours' \
            'output/code-penal-travail/*.json merge=ours' \
            'all_articles_code_civil.txt merge=ours' \
            'all_articles_code_penal.txt merge=ours' \
            'all_articles_code_civil_travail.txt merge=ours' \
            'all_articles_code_penal_travail.txt merge=ours' \
            'output/search-index-cgfp.json merge=ours' \
            'output/search-index-civil.json merge=ours' \
            'output/search-index-penal.json merge=ours' \
            > .gitattributes

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --- CGFP -----------------------------------------------------------
      - name: "CGFP : lister tous les articles (si pas déjà fait)"
        run: |
          if [ ! -s all_articles_cgfp.txt ]; then
            python3 scripts/list_all_code_articles.py --code-id LEGITEXT000044416551 --out all_articles_cgfp.txt
          else
            echo "all_articles_cgfp.txt déjà présent ($(wc -l < all_articles_cgfp.txt) articles), pas relisté."
          fi

      - name: "CGFP : récupérer le contenu des articles"
        run: |
          mkdir -p output/cgfp
          FLAG=""
          if [ "${{ github.event_name == 'schedule' && 'oui' || github.event.inputs.seulement_manquants || 'oui' }}" = "oui" ]; then
            FLAG="--only-missing"
          fi
          python3 scripts/pull_code_travail.py --articles-file all_articles_cgfp.txt --code-id LEGITEXT000044416551 --out output/cgfp $FLAG

      # --- Code civil / pénal (élargi) -------------------------------------
      # L'approche /search dans le fond CODE a échoué (HTTP 400 -- CODE
      # couvre ~80 codes, exige probablement de préciser lequel, contrairement
      # à JORF qui a marché avec la même requête). Repli sur des briques déjà
      # prouvées : lister TOUT le code (comme pour le CGFP), puis filtrer
      # localement sur les numéros d'articles ciblés -- aucun nouvel appel API.
      - name: "Code civil/pénal : lister tous les articles"
        run: |
          python3 scripts/list_all_code_articles.py --code-id LEGITEXT000006070721 --out all_articles_code_civil.txt
          python3 scripts/list_all_code_articles.py --code-id LEGITEXT000006070719 --out all_articles_code_penal.txt

      - name: "Code civil/pénal : filtrer sur les articles pertinents (local, sans appel réseau)"
        run: |
          python3 scripts/filtrer_articles_civil_penal.py --entree all_articles_code_civil.txt --sortie all_articles_code_civil_travail.txt --code civil
          python3 scripts/filtrer_articles_civil_penal.py --entree all_articles_code_penal.txt --sortie all_articles_code_penal_travail.txt --code penal

      - name: "Code civil/pénal : récupérer le contenu des articles filtrés"
        run: |
          mkdir -p output/code-civil-travail output/code-penal-travail
          python3 scripts/pull_code_travail.py --articles-file all_articles_code_civil_travail.txt --code-id LEGITEXT000006070721 --out output/code-civil-travail
          python3 scripts/pull_code_travail.py --articles-file all_articles_code_penal_travail.txt --code-id LEGITEXT000006070719 --out output/code-penal-travail

      # --- Index de recherche (agrégation des fichiers individuels) -------
      - name: "Construire les index de recherche (CGFP, Code civil, Code pénal)"
        run: |
          python3 scripts/build_search_index_extra.py --dossier output/cgfp --sortie output/search-index-cgfp.json
          python3 scripts/build_search_index_extra.py --dossier output/code-civil-travail --sortie output/search-index-civil.json
          python3 scripts/build_search_index_extra.py --dossier output/code-penal-travail --sortie output/search-index-penal.json

      # --- Commit unique pour les deux chantiers ---------------------------
      - name: Committer et pousser (rebase, puis merge -X ours en dernier recours)
        run: |
          git add output/cgfp/ all_articles_cgfp.txt \
                  output/code-civil-travail/ output/code-penal-travail/ \
                  all_articles_code_civil.txt all_articles_code_penal.txt \
                  all_articles_code_civil_travail.txt all_articles_code_penal_travail.txt \
                  output/search-index-cgfp.json \
                  output/search-index-civil.json \
                  output/search-index-penal.json \
                  .gitattributes

          if git diff --cached --quiet; then
            echo "Rien de nouveau."
            exit 0
          fi

          git commit -m "CGFP + Code civil/pénal (élargi) : mise à jour (${{ github.run_id }})"

          reussi=0
          for tentative in 1 2 3; do
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then git rebase --abort 2>/dev/null || true; fi
            if [ "$tentative" -lt 3 ]; then
              git pull --rebase --autostash origin main || true
            else
              echo "Dernière tentative : merge (-X ours) plutôt que rebase."
              git rebase --abort 2>/dev/null || true
              git pull --no-rebase --autostash -X ours origin main || true
            fi
            if git push; then reussi=1; break; fi
            echo "Tentative $tentative échouée, nouvel essai dans 5s…"
            sleep 5
          done
          if [ "$reussi" -ne 1 ]; then
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then git rebase --abort 2>/dev/null || true; fi
            echo "::error::Échec du push après 3 tentatives."
            exit 1
          fi
